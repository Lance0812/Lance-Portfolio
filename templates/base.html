{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Portfolio
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>


<body>

<header>

<nav>

    <div class="logo">
        My Portfolio
    </div>


    <div class="nav-links">

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'about' %}">
            About
        </a>

        <a href="{% url 'projects' %}">
            Projects
        </a>

        <a href="{% url 'contact' %}">
            Contact
        </a>

        <a href="{% url 'add_testimony' %}">
            Testimony
        </a>

        <a href="{% url 'testimony_list' %}">
            Reviews
        </a>


        {% if request.user.is_superuser %}

            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'sign_out' %}">
                Sign Out
            </a>

        {% else %}

            <a href="{% url 'sign_in' %}">
                Admin Sign In
            </a>

        {% endif %}

    </div>

</nav>

</header>


<main>

{% block content %}

{% endblock %}

</main>


<footer>

<p>
© 2026 My Portfolio
</p>

</footer>


</body>

</html>
