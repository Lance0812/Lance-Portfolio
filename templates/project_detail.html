{% extends 'base.html' %}


{% block title %}
{{ project.title }}
{% endblock %}



{% block content %}

<section>


{% if project.image %}

<img src="{{ project.image.url }}"
     alt="{{ project.title }}"
     class="project-detail-img">

{% endif %}



<h1>
{{ project.title }}
</h1>



<p>
{{ project.description }}
</p>



<h3>
Tech Stack
</h3>


<p>
{{ project.tech_stack }}
</p>



<a href="{{ project.github_url }}"
class="btn">
View GitHub
</a>


</section>

{% endblock %}
