{% extends 'base.html' %}


{% block title %}
Testimonials
{% endblock %}


{% block content %}

<section class="page-section">

<h1>
Client Testimonials
</h1>


<div class="card-container">


{% for testimony in testimonies %}


<div class="testimonial-card">


<h2>
{{ testimony.full_name }}
</h2>


<p>
{{ testimony.content }}
</p>


<a href="{% url 'testimony_detail' testimony.id %}">
Read More
</a>


</div>


{% empty %}

<p>
No testimonials yet.
</p>


{% endfor %}


</div>


</section>


{% endblock %}
